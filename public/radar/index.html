<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Радар заработка</title>
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/radar/manifest.webmanifest">
<link rel="icon" href="/radar/icon-192.png">
<link rel="apple-touch-icon" href="/radar/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Радар">
<style>
:root{
  --bg:#0b1020;--panel:#131a2e;--panel2:#1a2340;--line:#26304f;--text:#eef1f8;--muted:#8d97b5;
  --accent:#ffc531;--good:#3ddc97;--warn:#ff8a3d;--bad:#ff5c6c;--radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1}
.top h1 span{color:var(--accent)}
.status{font-size:12px;color:var(--muted)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
.search{display:flex;gap:8px;margin-top:10px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
main{padding:12px 16px calc(84px + var(--safe-b));max-width:760px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card:active{background:var(--panel2)}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.score{font-weight:700;border-radius:8px;padding:1px 7px;color:#111}
.cat{color:var(--accent)}
.card h3{font-size:16px;margin:6px 0 4px;line-height:1.3}
.card .earn{font-size:14px;color:#c9d1ea;margin:4px 0 0}
.risk{background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.4);color:#ffc49e;border-radius:10px;padding:7px 10px;font-size:13px;margin-top:8px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(19,26,46,.97);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;color:var(--muted);font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:none}
.sheet.open{display:block}
.sheet .body{position:absolute;left:0;right:0;bottom:0;top:6vh;background:var(--bg);border-radius:18px 18px 0 0;overflow-y:auto;padding:16px 16px calc(24px + var(--safe-b));max-width:760px;margin:0 auto}
.sheet h2{font-size:20px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.box h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
ol{padding-left:20px;margin:6px 0}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.box input[type=text],.box input[type=password],.box input[type=number],.box textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:64px}
video{width:100%;max-height:70vh;border-radius:12px;background:#000;margin-top:8px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.ok{color:var(--good)}.no{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90vw}
.small{font-size:12px;color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Радар <span>заработка</span></h1>
    <button class="iconbtn" id="refresh" title="Обновить сейчас">⟳</button>
  </div>
  <div class="status" id="status">Загрузка…</div>
  <div id="feedTools">
    <div class="search">
      <input id="q" type="search" placeholder="Поиск: маркетплейс, ИИ, кофейня…">
      <select id="sort"><option value="new">Новые</option><option value="score">Лучшие</option></select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <section id="tab-feed"><div id="list"></div></section>
  <section id="tab-reels" class="hide"><div id="reels"></div></section>
  <section id="tab-settings" class="hide"></section>
</main>

<nav>
  <button data-tab="feed" class="on"><b>📡</b>Лента</button>
  <button data-tab="starred"><b>⭐</b>Избранное</button>
  <button data-tab="reels"><b>🎬</b>Рилсы</button>
  <button data-tab="settings"><b>⚙️</b>Настройки</button>
</nav>

<div class="sheet" id="sheet"><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="/radar/app.js"></script>
</body>
</html>
