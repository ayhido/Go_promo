name: Claude Island — сборка для Windows

on:
  push:
    paths:
      - "claude-island/**"
      - ".github/workflows/claude-island.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: claude-island
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Island-Windows
          path: |
            claude-island/dist/*.exe
          if-no-files-found: error
